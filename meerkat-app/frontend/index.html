<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Meerkat</title>
    <!-- Both vendored under ./vendor/ rather than pulled from a CDN: this
         is a terminal, and a terminal that will not draw its own glyphs
         without a network is broken. `//go:embed all:frontend` bakes them
         into the binary, so there is nothing to install alongside it.
         See scripts/vendor-fonts.sh to refresh either one. -->
    <link rel="stylesheet" href="./vendor/xterm/xterm.css" />
    <link rel="stylesheet" href="./vendor/fonts/fonts.css" />
    <style>
      /* These are the "Clay" preset's values, inlined so the first paint
         is already themed. At runtime themes.js overwrites every one of
         them on <html> from the user's chosen preset — so treat this
         block as a default, not as the palette: no rule below should
         hardcode a color that a preset would need to change. */
      :root {
        --bg: #1b1917;
        --bg-raised: #232120;
        --bg-hover: rgba(245, 242, 234, 0.06);
        --border: rgba(245, 242, 234, 0.09);
        --text: #f5f2ea;
        --text-dim: #a09a90;
        --text-faint: #6b655d;
        --accent: #d97757;
        --danger: #f08a72;
        --warning: #d9a94d;
        --backdrop: rgba(18, 16, 15, 0.62);

        --font-ui: "DM Sans", -apple-system, "Helvetica Neue", sans-serif;
        /* Reserved for panel titles — the reference pairs a display serif
           against the geometric sans, and the overlay headings are the
           only place in this app with a title to set that way. */
        --font-display: "Instrument Serif", Georgia, serif;

        /* Written by appearance.js from the theme + the user's opacity and
           background-image settings. Defaults here are the fully-opaque,
           no-image case, so first paint is correct before JS runs. */
        --surface: #1b1917;
        --surface-raised: #232120;
        --font-mono: "JetBrains Mono", Menlo, monospace;
        /* The shipped logo is the default wallpaper, so first paint already
           shows it rather than flashing an empty window before JS runs. */
        --bg-image: url("/assets/meerkat-logo.png");
        --bg-image-size: 220px auto;
      }

      html,
      body {
        margin: 0;
        /* 100dvh, not 100% — during a macOS fullscreen transition the
           window's height changes before the layout viewport catches up,
           and a percentage height resolved against a stale containing
           block leaves the flex column taller than the window, which
           (with overflow:hidden below) silently clips the terminal's last
           row instead of scrolling. */
        height: 100dvh;
        /* The app itself never scrolls — only containers that opt in
           (the overlay panels' own overflow-y:auto) should. Without this,
           WebKit's backdrop-filter (on the overlay backdrops) can bleed
           its blur past the element's box and get counted as page
           overflow, putting a scrollbar on the whole window behind the
           modal instead of just inside it. */
        overflow: hidden;
        /* Transparent, not --bg: the window is created translucent (see
           main.go), so anything painted here would sit *under* every
           surface as an extra opaque layer and defeat the opacity
           setting. Each surface paints its own --surface/--surface-raised
           instead, giving exactly one translucent layer over whatever is
           behind the window. */
        background: transparent;
        font-family: var(--font-ui);
        -webkit-font-smoothing: antialiased;
      }
      body {
        display: flex;
        flex-direction: column;
      }

      /* The background image, behind everything. Fixed and z-index:-1 so it
         never participates in layout — the app's own surfaces are
         translucent and composite over it. The Meerkat mark is the default;
         choosing "None" in Preferences sets --bg-image: none, in which case
         this paints nothing at all and the translucent surfaces show the
         desktop instead.

         The low element opacity is deliberate and not user-adjustable: a
         wallpaper at full strength sits directly behind terminal text (the
         surfaces above it are translucent by design), and anything busier
         than a faint wash makes output unreadable. Element opacity rather
         than a pre-faded image so it applies to whatever the user picks. */
      #backdrop {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-image: var(--bg-image);
        background-size: var(--bg-image-size);
        background-repeat: no-repeat;
        background-position: center;
        opacity: 0.14;
        pointer-events: none;
      }

      /* Tab bar — flat, no dividers; the active tab reads by a slightly
         lighter label and a thin accent underline, nothing else. */
      #tabbar {
        display: flex;
        flex: 0 0 auto;
        align-items: flex-end;
        gap: 2px;
        padding: 10px 10px 0;
        background: var(--surface);
        -webkit-app-region: drag;
        min-height: 44px;
        box-sizing: border-box;
      }
      .tab {
        -webkit-app-region: no-drag;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        font-size: 13px;
        font-weight: 500;
        color: var(--text-dim);
        border-radius: 6px 6px 0 0;
        cursor: pointer;
        user-select: none;
        transition: color 0.12s ease, background 0.12s ease;
      }
      .tab:hover {
        color: var(--text);
        background: var(--bg-hover);
      }
      .tab.active {
        color: var(--text);
        background: var(--surface-raised);
        box-shadow: inset 0 -2px 0 var(--accent);
      }
      .tab-badge {
        font-size: 10px;
        font-weight: 500;
        color: var(--text-faint);
        background: var(--bg-hover);
        border-radius: 4px;
        padding: 1px 5px;
      }
      .tab-close {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 18px;
        height: 18px;
        border-radius: 4px;
        font-size: 14px;
        line-height: 1;
        color: var(--text-faint);
      }
      .tab-close:hover {
        color: var(--danger);
        background: var(--bg-hover);
      }

      /* Sidebar + panes, side by side below the tab bar. */
      #workspace {
        display: flex;
        flex: 1 1 auto;
        min-height: 0;
      }

      #sidebar {
        flex: 0 0 250px;
        min-height: 0;
        overflow-y: auto;
        background: var(--surface);
        border-right: 1px solid var(--border);
        padding: 6px 0 12px;
        box-sizing: border-box;
      }
      #sidebar.hidden {
        display: none;
      }
      .sidebar-section + .sidebar-section {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--border);
      }
      .sidebar-heading {
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-faint);
        padding: 6px 14px;
      }
      .sidebar-row {
        margin: 0 6px;
        padding: 6px 8px;
        border-radius: 6px;
        font-size: 12px;
        color: var(--text-dim);
      }
      .sidebar-empty {
        padding: 4px 14px;
        font-size: 11.5px;
        color: var(--text-faint);
      }
      .sidebar-session {
        display: flex;
        align-items: center;
        gap: 7px;
        cursor: pointer;
      }
      .sidebar-session:hover {
        background: var(--bg-hover);
        color: var(--text);
      }
      .sidebar-session-active {
        color: var(--text);
      }
      .sidebar-marker {
        flex: 0 0 auto;
        font-size: 8px;
        color: var(--accent);
      }
      /* Paths are long and the sidebar is narrow — clip from the *left* so
         the meaningful tail (the directory you're actually in) survives,
         rather than the "/Users/..." prefix every row shares. */
      .sidebar-label {
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        direction: rtl;
        text-align: left;
      }
      .sidebar-job-top {
        display: flex;
        align-items: baseline;
        gap: 6px;
      }
      .sidebar-job .job-cmd {
        display: block;
        margin-top: 2px;
        font-family: "JetBrains Mono", Menlo, monospace;
        font-size: 11px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* Panes */
      #panes {
        position: relative;
        flex: 1 1 auto;
        min-width: 0;
        min-height: 0;
        /* The single layer carrying the terminal area's tint, at the
           opacity chosen in Preferences (--surface-raised is
           rgba(theme background, opacity) — see appearance.js). The xterm
           canvases above are fully transparent, so this is not stacked
           with a second tint, and because it spans the whole pane it also
           covers the few pixels along the right/bottom edge that xterm's
           whole-cell canvas sizing always leaves uncovered. */
        background: var(--surface-raised);
      }
      /* One per tab; holds that tab's split tree. Only the active tab's
         root is displayed (sessionManager toggles display flex/none). */
      .tab-pane-root {
        position: absolute;
        inset: 0;
        display: flex;
      }

      /* Split containers and their children. The min-width/min-height: 0
         on both is load-bearing: flex items default to min-content sizing,
         which would stop a terminal from ever shrinking below the width of
         its longest output line and let panes overflow their split. */
      .split {
        display: flex;
        flex: 1 1 0;
        min-width: 0;
        min-height: 0;
      }
      .split-row {
        flex-direction: row;
      }
      .split-column {
        flex-direction: column;
      }
      .split-child {
        display: flex;
        min-width: 0;
        min-height: 0;
      }

      .divider {
        flex: 0 0 5px;
        background: var(--border);
        transition: background 0.12s ease;
      }
      .divider:hover,
      body.dragging-divider .divider {
        background: var(--accent);
      }
      .divider-row {
        cursor: col-resize;
      }
      .divider-column {
        cursor: row-resize;
      }
      /* While dragging, the cursor must not flicker as it passes over the
         terminals either side, and text must not get selected. */
      body.dragging-divider {
        user-select: none;
      }
      body.dragging-divider * {
        cursor: inherit !important;
      }

      /* Only a small left/top inset so glyphs don't touch the window edge.
         Deliberately minimal: any padding here is dead space the terminal
         grid can't use, and a larger inset reads as a frame around the
         terminal rather than as breathing room. */
      .pane {
        flex: 1 1 0;
        min-width: 0;
        min-height: 0;
        position: relative;
        padding: 6px 0 0 10px;
        box-sizing: border-box;
      }
      /* Shown in place of a terminal when the daemon can't be reached. */
      .pane-error {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        gap: 10px;
        padding: 0 40px;
        max-width: 620px;
        margin: 0 auto;
      }
      .pane-error-title {
        font-family: var(--font-display);
        font-size: 22px;
        color: var(--text);
      }
      .pane-error-detail {
        font-family: "JetBrains Mono", Menlo, monospace;
        font-size: 12px;
        color: var(--danger);
        word-break: break-word;
      }
      .pane-error-hint {
        font-size: 12.5px;
        line-height: 1.6;
        color: var(--text-dim);
      }
      .pane-error code {
        font-family: "JetBrains Mono", Menlo, monospace;
        font-size: 11.5px;
        background: var(--bg-hover);
        border-radius: 4px;
        padding: 1px 5px;
      }

      /* Applied only when a tab actually has more than one pane — see
         updateFocusRing. inset rather than a real border so adding it
         doesn't change the pane's box and reflow the terminal. */
      .pane-focused {
        box-shadow: inset 0 0 0 1px var(--accent);
        border-radius: 4px;
      }

      /* Preferences modal — the one thing still presented as a floating
         card over a blurred backdrop (it's a settings dialog, not a
         working surface). The sessions/jobs view that used to share this
         chrome is now #sidebar above. */
      #prefs-overlay {
        /* fixed, not absolute: this is a viewport-level modal, and
           position:absolute made its size depend on the page box — which
           is what let the blurred backdrop feed back into the document's
           own scroll height. */
        position: fixed;
        inset: 0;
        background: var(--backdrop);
        backdrop-filter: blur(6px);
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding-top: 64px;
        z-index: 10;
      }
      #prefs-overlay.hidden {
        display: none;
      }
      .overlay-panel {
        background: var(--bg-raised);
        border-radius: 14px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        width: 480px;
        max-width: 90%;
        max-height: 70vh;
        overflow-y: auto;
        padding: 8px 0 14px;
      }
      .overlay-heading {
        font-family: var(--font-display);
        color: var(--text);
        font-size: 18px;
        font-weight: 400;
        letter-spacing: 0.01em;
        padding: 14px 18px 8px;
      }
      .job-id {
        color: var(--text-faint);
        font-weight: 500;
      }
      .job-status {
        color: var(--accent);
        margin: 0 8px;
      }
      .job-mem {
        color: var(--text-dim);
        margin-right: 8px;
      }
      .job-cmd {
        color: var(--text-dim);
      }

      /* Theme picker. Each card paints itself in its own preset's colors
         (set inline from themes.js), so this grid is a live preview —
         which is why it deliberately uses no --token colors of its own. */
      .theme-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        padding: 4px 18px 10px;
      }
      .theme-card {
        border: 1px solid;
        border-radius: 10px;
        padding: 10px 12px;
        cursor: pointer;
        transition: transform 0.12s ease;
      }
      .theme-card:hover {
        transform: translateY(-1px);
      }
      .theme-card-active {
        border-width: 2px;
        padding: 9px 11px; /* offset the thicker border so cards stay aligned */
      }
      .theme-swatches {
        display: flex;
        gap: 4px;
        margin-bottom: 8px;
      }
      .theme-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }
      .theme-name {
        font-size: 12.5px;
        font-weight: 500;
      }
      .theme-desc {
        font-size: 10.5px;
        line-height: 1.35;
        margin-top: 2px;
      }

      /* Preferences overlay */
      .prefs-panel {
        width: 640px;
        padding-top: 4px;
      }
      .prefs-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 18px;
        margin: 0 6px;
        border-radius: 8px;
      }
      .prefs-row:hover {
        background: var(--bg-hover);
      }
      .prefs-row-text {
        flex: 1 1 auto;
        min-width: 0;
      }
      .prefs-row-label {
        font-size: 13px;
        font-weight: 500;
        color: var(--text);
      }
      .prefs-row-desc {
        font-size: 11.5px;
        color: var(--text-faint);
        margin-top: 2px;
      }
      /* Key combos are the one place a mono face earns its keep in the
         chrome — "⌥⌫" and "⌃⇧F" line up column-wise down the list. */
      .prefs-row-combo {
        flex: 0 0 auto;
        min-width: 90px;
        text-align: right;
        font-family: "JetBrains Mono", Menlo, monospace;
        font-size: 12px;
        font-weight: 500;
        color: var(--accent);
        white-space: nowrap;
      }
      .prefs-row-recording .prefs-row-combo {
        font-family: var(--font-ui);
        color: var(--warning);
        font-style: italic;
        font-weight: 400;
      }
      .prefs-btn {
        flex: 0 0 auto;
        font-family: inherit;
        font-size: 11.5px;
        font-weight: 500;
        color: var(--text-dim);
        background: transparent;
        border: none;
        border-radius: 6px;
        padding: 5px 10px;
        cursor: pointer;
        transition: color 0.12s ease, background 0.12s ease;
      }
      .prefs-btn:hover {
        color: var(--text);
        background: var(--bg-hover);
      }
      .prefs-btn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .prefs-btn:disabled:hover {
        color: var(--text-dim);
        background: transparent;
      }

      /* Appearance controls. accent-color hands the native range/number
         widgets the theme's accent without restyling them from scratch. */
      .prefs-range {
        flex: 0 0 130px;
        accent-color: var(--accent);
      }
      .prefs-select,
      .prefs-number {
        flex: 0 0 auto;
        font-family: inherit;
        font-size: 12px;
        color: var(--text);
        background: var(--bg-hover);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 4px 6px;
        accent-color: var(--accent);
      }
      .prefs-number {
        width: 56px;
      }
      .prefs-error {
        color: var(--danger);
      }
      .prefs-footer {
        border-top: 1px solid var(--border);
        margin: 10px 6px 0;
        padding: 12px 12px 0;
        display: flex;
        justify-content: flex-end;
      }
    </style>
  </head>
  <body>
    <!-- Background image, painted faintly behind every surface. The Meerkat
         mark by default; changed or removed in Preferences → Appearance. -->
    <div id="backdrop"></div>
    <div id="tabbar"></div>
    <!-- Sidebar and panes are siblings in a flex row, not stacked layers:
         opening the sidebar takes width away from the terminals rather
         than covering them. -->
    <div id="workspace">
      <aside id="sidebar" class="hidden"></aside>
      <div id="panes"></div>
    </div>
    <!-- Classic scripts, not modules: both set globals (window.Terminal,
         window.FitAddon) that main.js and session.js read, so they must
         finish executing before the module below runs. -->
    <script src="./vendor/xterm/xterm.js"></script>
    <script src="./vendor/xterm/addon-fit.js"></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
