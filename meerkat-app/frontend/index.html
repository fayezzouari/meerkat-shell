<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Meerkat</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5/css/xterm.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Instrument+Serif&family=JetBrains+Mono:wght@500;700&display=swap"
    />
    <style>
      /* These are the "Clay" preset's values, inlined so the first paint
         is already themed. At runtime themes.js overwrites every one of
         them on <html> from the user's chosen preset — so treat this
         block as a default, not as the palette: no rule below should
         hardcode a color that a preset would need to change. */
      :root {
        --bg: #1b1917;
        --bg-raised: #232120;
        --bg-hover: rgba(245, 242, 234, 0.06);
        --border: rgba(245, 242, 234, 0.09);
        --text: #f5f2ea;
        --text-dim: #a09a90;
        --text-faint: #6b655d;
        --accent: #d97757;
        --danger: #f08a72;
        --warning: #d9a94d;
        --backdrop: rgba(18, 16, 15, 0.62);

        --font-ui: "DM Sans", -apple-system, "Helvetica Neue", sans-serif;
        /* Reserved for panel titles — the reference pairs a display serif
           against the geometric sans, and the overlay headings are the
           only place in this app with a title to set that way. */
        --font-display: "Instrument Serif", Georgia, serif;
      }

      html,
      body {
        margin: 0;
        /* 100dvh, not 100% — during a macOS fullscreen transition the
           window's height changes before the layout viewport catches up,
           and a percentage height resolved against a stale containing
           block leaves the flex column taller than the window, which
           (with overflow:hidden below) silently clips the terminal's last
           row instead of scrolling. */
        height: 100dvh;
        /* The app itself never scrolls — only containers that opt in
           (the overlay panels' own overflow-y:auto) should. Without this,
           WebKit's backdrop-filter (on the overlay backdrops) can bleed
           its blur past the element's box and get counted as page
           overflow, putting a scrollbar on the whole window behind the
           modal instead of just inside it. */
        overflow: hidden;
        background: var(--bg);
        font-family: var(--font-ui);
        -webkit-font-smoothing: antialiased;
      }
      body {
        display: flex;
        flex-direction: column;
      }

      /* Tab bar — flat, no dividers; the active tab reads by a slightly
         lighter label and a thin accent underline, nothing else. */
      #tabbar {
        display: flex;
        flex: 0 0 auto;
        align-items: flex-end;
        gap: 2px;
        padding: 10px 10px 0;
        background: var(--bg);
        -webkit-app-region: drag;
        min-height: 44px;
        box-sizing: border-box;
      }
      .tab {
        -webkit-app-region: no-drag;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        font-size: 13px;
        font-weight: 500;
        color: var(--text-dim);
        border-radius: 6px 6px 0 0;
        cursor: pointer;
        user-select: none;
        transition: color 0.12s ease, background 0.12s ease;
      }
      .tab:hover {
        color: var(--text);
        background: var(--bg-hover);
      }
      .tab.active {
        color: var(--text);
        background: var(--bg-raised);
        box-shadow: inset 0 -2px 0 var(--accent);
      }
      .tab-badge {
        font-size: 10px;
        font-weight: 500;
        color: var(--text-faint);
        background: var(--bg-hover);
        border-radius: 4px;
        padding: 1px 5px;
      }
      .tab-close {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 18px;
        height: 18px;
        border-radius: 4px;
        font-size: 14px;
        line-height: 1;
        color: var(--text-faint);
      }
      .tab-close:hover {
        color: var(--danger);
        background: var(--bg-hover);
      }

      /* Panes */
      #panes {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        background: var(--bg-raised);
      }
      /* One per tab; holds that tab's split tree. Only the active tab's
         root is displayed (sessionManager toggles display flex/none). */
      .tab-pane-root {
        position: absolute;
        inset: 0;
        display: flex;
      }

      /* Split containers and their children. The min-width/min-height: 0
         on both is load-bearing: flex items default to min-content sizing,
         which would stop a terminal from ever shrinking below the width of
         its longest output line and let panes overflow their split. */
      .split {
        display: flex;
        flex: 1 1 0;
        min-width: 0;
        min-height: 0;
      }
      .split-row {
        flex-direction: row;
      }
      .split-column {
        flex-direction: column;
      }
      .split-child {
        display: flex;
        min-width: 0;
        min-height: 0;
      }

      .divider {
        flex: 0 0 5px;
        background: var(--border);
        transition: background 0.12s ease;
      }
      .divider:hover,
      body.dragging-divider .divider {
        background: var(--accent);
      }
      .divider-row {
        cursor: col-resize;
      }
      .divider-column {
        cursor: row-resize;
      }
      /* While dragging, the cursor must not flicker as it passes over the
         terminals either side, and text must not get selected. */
      body.dragging-divider {
        user-select: none;
      }
      body.dragging-divider * {
        cursor: inherit !important;
      }

      /* Only a small left/top inset so glyphs don't touch the window edge.
         Deliberately minimal: any padding here is dead space the terminal
         grid can't use, and a larger inset reads as a frame around the
         terminal rather than as breathing room. */
      .pane {
        flex: 1 1 0;
        min-width: 0;
        min-height: 0;
        position: relative;
        padding: 6px 0 0 10px;
        box-sizing: border-box;
      }
      /* Applied only when a tab actually has more than one pane — see
         updateFocusRing. inset rather than a real border so adding it
         doesn't change the pane's box and reflow the terminal. */
      .pane-focused {
        box-shadow: inset 0 0 0 1px var(--accent);
        border-radius: 4px;
      }

      /* Shared overlay chrome (Ctrl+M jobs/sessions, Preferences) — a
         softly blurred backdrop and a floating card, no hard borders. */
      #overlay,
      #prefs-overlay {
        /* fixed, not absolute: these are viewport-level modals, and
           position:absolute made their size depend on the page box —
           which is what let the blurred backdrop feed back into the
           document's own scroll height. */
        position: fixed;
        inset: 0;
        background: var(--backdrop);
        backdrop-filter: blur(6px);
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding-top: 64px;
        z-index: 10;
      }
      #overlay.hidden,
      #prefs-overlay.hidden {
        display: none;
      }
      .overlay-panel {
        background: var(--bg-raised);
        border-radius: 14px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        width: 480px;
        max-width: 90%;
        max-height: 70vh;
        overflow-y: auto;
        padding: 8px 0 14px;
      }
      .overlay-section + .overlay-section {
        border-top: 1px solid var(--border);
        margin-top: 6px;
        padding-top: 6px;
      }
      .overlay-heading {
        font-family: var(--font-display);
        color: var(--text);
        font-size: 18px;
        font-weight: 400;
        letter-spacing: 0.01em;
        padding: 14px 18px 8px;
      }
      .overlay-row {
        padding: 7px 18px;
        font-size: 13px;
        color: var(--text-dim);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        border-radius: 8px;
        margin: 0 6px;
      }
      .overlay-session {
        cursor: pointer;
      }
      .overlay-session:hover {
        background: var(--bg-hover);
        color: var(--text);
      }
      .overlay-empty {
        padding: 7px 18px;
        font-size: 13px;
        color: var(--text-faint);
      }
      .job-id {
        color: var(--text-faint);
        font-weight: 500;
      }
      .job-status {
        color: var(--accent);
        margin: 0 8px;
      }
      .job-mem {
        color: var(--text-dim);
        margin-right: 8px;
      }
      .job-cmd {
        color: var(--text-dim);
      }

      /* Theme picker. Each card paints itself in its own preset's colors
         (set inline from themes.js), so this grid is a live preview —
         which is why it deliberately uses no --token colors of its own. */
      .theme-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        padding: 4px 18px 10px;
      }
      .theme-card {
        border: 1px solid;
        border-radius: 10px;
        padding: 10px 12px;
        cursor: pointer;
        transition: transform 0.12s ease;
      }
      .theme-card:hover {
        transform: translateY(-1px);
      }
      .theme-card-active {
        border-width: 2px;
        padding: 9px 11px; /* offset the thicker border so cards stay aligned */
      }
      .theme-swatches {
        display: flex;
        gap: 4px;
        margin-bottom: 8px;
      }
      .theme-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }
      .theme-name {
        font-size: 12.5px;
        font-weight: 500;
      }
      .theme-desc {
        font-size: 10.5px;
        line-height: 1.35;
        margin-top: 2px;
      }

      /* Preferences overlay */
      .prefs-panel {
        width: 640px;
        padding-top: 4px;
      }
      .prefs-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 18px;
        margin: 0 6px;
        border-radius: 8px;
      }
      .prefs-row:hover {
        background: var(--bg-hover);
      }
      .prefs-row-text {
        flex: 1 1 auto;
        min-width: 0;
      }
      .prefs-row-label {
        font-size: 13px;
        font-weight: 500;
        color: var(--text);
      }
      .prefs-row-desc {
        font-size: 11.5px;
        color: var(--text-faint);
        margin-top: 2px;
      }
      /* Key combos are the one place a mono face earns its keep in the
         chrome — "⌥⌫" and "⌃⇧F" line up column-wise down the list. */
      .prefs-row-combo {
        flex: 0 0 auto;
        min-width: 90px;
        text-align: right;
        font-family: "JetBrains Mono", Menlo, monospace;
        font-size: 12px;
        font-weight: 500;
        color: var(--accent);
        white-space: nowrap;
      }
      .prefs-row-recording .prefs-row-combo {
        font-family: var(--font-ui);
        color: var(--warning);
        font-style: italic;
        font-weight: 400;
      }
      .prefs-btn {
        flex: 0 0 auto;
        font-family: inherit;
        font-size: 11.5px;
        font-weight: 500;
        color: var(--text-dim);
        background: transparent;
        border: none;
        border-radius: 6px;
        padding: 5px 10px;
        cursor: pointer;
        transition: color 0.12s ease, background 0.12s ease;
      }
      .prefs-btn:hover {
        color: var(--text);
        background: var(--bg-hover);
      }
      .prefs-footer {
        border-top: 1px solid var(--border);
        margin: 10px 6px 0;
        padding: 12px 12px 0;
        display: flex;
        justify-content: flex-end;
      }
    </style>
  </head>
  <body>
    <div id="tabbar"></div>
    <div id="panes"></div>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10/lib/addon-fit.js"></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
