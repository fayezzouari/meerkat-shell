<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Meerkat</title>
    <!-- Vendored, not CDN: a terminal that won't draw its glyphs offline is
         broken. Refresh with scripts/vendor-fonts.sh. -->
    <link rel="stylesheet" href="./vendor/xterm/xterm.css" />
    <link rel="stylesheet" href="./vendor/fonts/fonts.css" />
    <style>
      /* The "Clay" preset, inlined so the first paint is themed; themes.js
         overwrites all of it at runtime. No rule below may hardcode a color
         a preset would need to change. */
      :root {
        --bg: #1b1917;
        --bg-raised: #232120;
        --bg-hover: rgba(245, 242, 234, 0.06);
        --border: rgba(245, 242, 234, 0.09);
        --text: #f5f2ea;
        --text-dim: #a09a90;
        --text-faint: #6b655d;
        --accent: #d97757;
        --danger: #f08a72;
        --warning: #d9a94d;
        --success: #9cbf7a;
        --backdrop: rgba(18, 16, 15, 0.62);

        --font-ui: "DM Sans", -apple-system, "Helvetica Neue", sans-serif;
        --font-display: "Instrument Serif", Georgia, serif;

        /* Written by appearance.js; these defaults are the fully-opaque
           case, so first paint is correct before JS runs. */
        --surface: #1b1917;
        --surface-raised: #232120;
        --font-mono: "JetBrains Mono", Menlo, monospace;
        /* Only a user-chosen wallpaper; the default mark is a canvas. */
        --bg-image: none;
      }

      html,
      body {
        margin: 0;
        /* 100dvh, not 100%: during a macOS fullscreen transition a
           percentage resolves against a stale containing block and clips
           the terminal's last row. */
        height: 100dvh;
        /* Also stops WebKit's backdrop-filter blur from bleeding past the
           overlay's box and scrolling the whole window behind the modal. */
        overflow: hidden;
        /* Transparent, not --bg: the window is created translucent, so
           anything painted here would be an extra opaque layer under every
           surface and defeat the opacity setting. */
        background: transparent;
        font-family: var(--font-ui);
        -webkit-font-smoothing: antialiased;
      }
      body {
        display: flex;
        flex-direction: column;
      }

      /* Behind everything and out of layout; the translucent surfaces
         composite over it. The low opacity is deliberate and not
         user-adjustable — this sits directly behind terminal text, and
         anything busier than a faint wash makes output unreadable. */
      #backdrop {
        position: fixed;
        inset: 0;
        z-index: -1;
        display: flex;
        align-items: center;
        justify-content: center;
        background-image: var(--bg-image);
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        opacity: 0.14;
        pointer-events: none;
      }
      /* The default mark, painted by backdrop.js. The renderer sizes the
         element itself; this only supplies the ink via currentColor. */
      #backdrop canvas {
        display: block;
        color: var(--text);
      }

      #tabbar {
        display: flex;
        flex: 0 0 auto;
        align-items: flex-end;
        gap: 2px;
        padding: 10px 10px 0;
        background: var(--surface);
        -webkit-app-region: drag;
        min-height: 44px;
        box-sizing: border-box;
      }
      .tab {
        -webkit-app-region: no-drag;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        font-size: 13px;
        font-weight: 500;
        color: var(--text-dim);
        border-radius: 6px 6px 0 0;
        cursor: pointer;
        user-select: none;
        transition: color 0.12s ease, background 0.12s ease;
      }
      .tab:hover {
        color: var(--text);
        background: var(--bg-hover);
      }
      .tab.active {
        color: var(--text);
        background: var(--surface-raised);
        box-shadow: inset 0 -2px 0 var(--accent);
      }
      .tab-badge {
        font-size: 10px;
        font-weight: 500;
        color: var(--text-faint);
        background: var(--bg-hover);
        border-radius: 4px;
        padding: 1px 5px;
      }
      .tab-close {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 18px;
        height: 18px;
        border-radius: 4px;
        font-size: 14px;
        line-height: 1;
        color: var(--text-faint);
      }
      .tab-close:hover {
        color: var(--danger);
        background: var(--bg-hover);
      }

      #workspace {
        display: flex;
        flex: 1 1 auto;
        min-height: 0;
      }

      #sidebar {
        /* Set by sidebar.js from the saved width; the fallback here is the
           default, so the panel is the right size on the first paint rather
           than snapping a frame later. */
        flex: 0 0 var(--sidebar-width, 250px);
        min-height: 0;
        overflow-y: auto;
        background: var(--surface);
        border-right: 1px solid var(--border);
        padding: 6px 0 12px;
        box-sizing: border-box;
      }
      #sidebar.hidden {
        display: none;
      }
      /* The grab area for resizing, sitting over the sidebar's own 1px border:
         invisible until touched, so the seam still reads as a hairline rather
         than as a second divider. Wider than it looks, because a 1px target is
         not one. */
      #sidebar-grip {
        flex: 0 0 4px;
        cursor: col-resize;
        background: transparent;
        transition: background 0.12s ease;
      }
      #sidebar-grip:hover,
      #sidebar-grip.is-dragging {
        background: var(--accent);
      }
      #sidebar-grip.hidden {
        display: none;
      }
      .sidebar-section + .sidebar-section {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--border);
      }
      .sidebar-heading {
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-faint);
        padding: 6px 14px;
      }
      .sidebar-row {
        margin: 0 6px;
        padding: 6px 8px;
        border-radius: 6px;
        font-size: 12px;
        color: var(--text-dim);
      }
      .sidebar-empty {
        padding: 4px 14px;
        font-size: 11.5px;
        color: var(--text-faint);
      }
      .sidebar-session {
        display: flex;
        align-items: center;
        gap: 7px;
        cursor: pointer;
      }
      .sidebar-session:hover {
        background: var(--bg-hover);
        color: var(--text);
      }
      .sidebar-session-active {
        color: var(--text);
      }
      .sidebar-marker {
        flex: 0 0 auto;
        font-size: 8px;
        color: var(--accent);
      }
      /* Clips from the left, so the meaningful tail of a long path survives
         rather than the "/Users/..." prefix every row shares. */
      .sidebar-label {
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        direction: rtl;
        text-align: left;
      }
      .sidebar-heading-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }
      .sidebar-icon-btn {
        flex: 0 0 auto;
        padding: 1px 6px;
        font-family: inherit;
        font-size: 11px;
        line-height: 1.5;
        color: var(--text-faint);
        background: transparent;
        border: 1px solid transparent;
        border-radius: 4px;
        cursor: pointer;
      }
      .sidebar-icon-btn:hover {
        color: var(--text);
        background: var(--bg-hover);
        border-color: var(--border);
      }
      .sidebar-icon-danger:hover {
        color: var(--danger);
      }

      .sidebar-worktree {
        display: flex;
        align-items: center;
        gap: 7px;
        cursor: pointer;
      }
      .sidebar-worktree:hover {
        background: var(--bg-hover);
        color: var(--text);
      }
      .sidebar-worktree-active {
        color: var(--text);
      }
      .wt-name {
        flex: 0 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* Only shown when it adds something the directory name doesn't. */
      .wt-branch {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 11px;
        color: var(--text-faint);
        text-align: right;
      }
      .wt-tag {
        flex: 0 0 auto;
        font-size: 9.5px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--text-faint);
        background: var(--bg-hover);
        border-radius: 3px;
        padding: 1px 4px;
      }
      .wt-tag-dirty {
        color: var(--warning);
        background: transparent;
        font-size: 8px;
        padding: 0;
      }
      .wt-tag-stale {
        color: var(--danger);
      }
      /* A dev engine is the one you can lose track of; it gets the accent. */
      .wt-tag-dev {
        color: var(--accent);
      }
      .engine-id {
        margin-left: 3px;
        font-family: var(--font-mono);
        letter-spacing: 0;
        text-transform: none;
        opacity: 0.8;
      }
      /* Kept out of the layout until hover so the row doesn't reflow, and so a
         mis-aimed click on a resting row can't start a removal. */
      .wt-remove {
        visibility: hidden;
      }
      .sidebar-worktree:hover .wt-remove {
        visibility: visible;
      }
      .sidebar-worktree-confirm {
        display: flex;
        align-items: center;
        gap: 4px;
        background: var(--bg-hover);
      }
      .wt-confirm-text {
        flex: 1 1 auto;
        min-width: 0;
        font-size: 11px;
        color: var(--text);
      }
      .wt-input {
        width: 100%;
        box-sizing: border-box;
        padding: 3px 6px;
        font-family: var(--font-mono);
        font-size: 11.5px;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--accent);
        border-radius: 4px;
        outline: none;
      }
      .sidebar-hint {
        padding: 2px 14px 4px;
        font-size: 10.5px;
        color: var(--text-faint);
        overflow-wrap: anywhere;
      }
      .sidebar-error {
        margin: 2px 6px 0;
        padding: 5px 8px;
        border-radius: 6px;
        font-size: 11px;
        color: var(--danger);
        background: var(--bg-hover);
        overflow-wrap: anywhere;
      }

      /* Wraps rather than overflowing. Every atom in here is unsplittable and
         the sidebar can be dragged narrow, so without this the row runs past
         the panel's edge and takes the kill button with it — off-screen, on the
         one row that may have no other way to be stopped. */
      .sidebar-job-top {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 6px;
      }
      /* The port a job is serving on: the one thing about a running server
         worth reading before its command line. */
      .job-port {
        flex: 0 0 auto;
        white-space: nowrap;
        font-family: var(--font-mono);
        font-size: 10.5px;
        color: var(--accent);
        background: var(--bg-hover);
        border-radius: 3px;
        padding: 1px 4px;
      }
      /* "no window" — same shape as a worktree tag, since it reads the same way:
         a small fact about the row it sits in. */
      .job-tag {
        flex: 0 0 auto;
        white-space: nowrap;
        font-size: 9.5px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--text-faint);
        background: var(--bg-hover);
        border-radius: 3px;
        padding: 1px 4px;
      }
      /* Always visible, unlike the worktree remove: a job whose pane is gone
         has nowhere else to be stopped from, so the button should not be
         something you have to find. */
      .job-kill {
        margin-left: auto;
        flex: 0 0 auto;
      }
      .sidebar-job .job-cmd {
        display: block;
        margin-top: 2px;
        font-family: "JetBrains Mono", Menlo, monospace;
        font-size: 11px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #panes {
        position: relative;
        flex: 1 1 auto;
        min-width: 0;
        min-height: 0;
        /* The single layer carrying the terminal area's tint (see
           appearance.js). The xterm canvases above are fully transparent, and
           this spans the pane, covering the few pixels xterm's whole-cell
           canvas sizing leaves along the right/bottom edge. */
        background: var(--surface-raised);
      }
      /* One per tab; sessionManager toggles display flex/none. */
      .tab-pane-root {
        position: absolute;
        inset: 0;
        display: flex;
      }

      /* min-width/min-height: 0 is load-bearing: flex items default to
         min-content sizing, which would stop a terminal shrinking below its
         longest output line and overflow the split. */
      .split {
        display: flex;
        flex: 1 1 0;
        min-width: 0;
        min-height: 0;
      }
      .split-row {
        flex-direction: row;
      }
      .split-column {
        flex-direction: column;
      }
      .split-child {
        display: flex;
        min-width: 0;
        min-height: 0;
      }

      .divider {
        flex: 0 0 5px;
        background: var(--border);
        transition: background 0.12s ease;
      }
      .divider:hover,
      body.dragging-divider .divider {
        background: var(--accent);
      }
      .divider-row {
        cursor: col-resize;
      }
      .divider-column {
        cursor: row-resize;
      }
      /* Stops cursor flicker and text selection mid-drag. */
      body.dragging-divider {
        user-select: none;
      }
      body.dragging-divider * {
        cursor: inherit !important;
      }

      /* Minimal inset: padding here is dead space the terminal grid can't
         use, and more of it reads as a frame.
         content-box, not border-box, is what makes that inset honest. FitAddon
         sizes the grid from getComputedStyle(pane).height, and under border-box
         that value is the border-box height — the padding included. It would fit
         a grid to space the padding had already taken, and the top inset then
         pushed the last row that far past the bottom edge: measured at 4-6px of
         the final row cut off, at every window height leaving less than 6px over
         after the rows divide. Under content-box the same property resolves to
         the content height, so the grid is fitted to the room it actually has,
         and the bottom padding is real clearance rather than a number nothing
         reads. */
      .pane {
        flex: 1 1 0;
        min-width: 0;
        min-height: 0;
        position: relative;
        padding: 6px 0 6px 10px;
        box-sizing: content-box;
      }
      /* Shown in place of a terminal when the daemon can't be reached. */
      .pane-error {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        gap: 10px;
        padding: 0 40px;
        max-width: 620px;
        margin: 0 auto;
      }
      .pane-error-title {
        font-family: var(--font-display);
        font-size: 22px;
        color: var(--text);
      }
      .pane-error-detail {
        font-family: "JetBrains Mono", Menlo, monospace;
        font-size: 12px;
        color: var(--danger);
        word-break: break-word;
      }
      .pane-error-hint {
        font-size: 12.5px;
        line-height: 1.6;
        color: var(--text-dim);
      }
      .pane-error code {
        font-family: "JetBrains Mono", Menlo, monospace;
        font-size: 11.5px;
        background: var(--bg-hover);
        border-radius: 4px;
        padding: 1px 5px;
      }

      /* inset rather than a real border, so adding it doesn't change the
         pane's box and reflow the terminal. */
      .pane-focused {
        box-shadow: inset 0 0 0 1px var(--accent);
        border-radius: 4px;
      }

      #prefs-overlay {
        /* fixed, not absolute: absolute made the modal's size depend on the
           page box, letting the blurred backdrop feed back into the
           document's own scroll height. */
        position: fixed;
        inset: 0;
        background: var(--backdrop);
        backdrop-filter: blur(6px);
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding-top: 64px;
        z-index: 10;
      }
      #prefs-overlay.hidden {
        display: none;
      }
      .overlay-panel {
        background: var(--bg-raised);
        border-radius: 14px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        width: 480px;
        max-width: 90%;
        max-height: 70vh;
        overflow-y: auto;
        padding: 8px 0 14px;
      }
      .overlay-heading {
        font-family: var(--font-display);
        color: var(--text);
        font-size: 18px;
        font-weight: 400;
        letter-spacing: 0.01em;
        padding: 14px 18px 8px;
      }
      .job-id {
        color: var(--text-faint);
        font-weight: 500;
      }
      .job-status {
        color: var(--accent);
        margin: 0 8px;
      }
      .job-mem {
        flex: 0 0 auto;
        white-space: nowrap;
        color: var(--text-dim);
      }
      .job-cmd {
        color: var(--text-dim);
      }

      /* Each card paints itself in its own preset's colors, set inline from
         themes.js — so this grid uses no --token colors of its own. */
      .theme-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        padding: 4px 18px 10px;
      }
      .theme-card {
        border: 1px solid;
        border-radius: 10px;
        padding: 10px 12px;
        cursor: pointer;
        transition: transform 0.12s ease;
      }
      .theme-card:hover {
        transform: translateY(-1px);
      }
      .theme-card-active {
        border-width: 2px;
        padding: 9px 11px; /* offsets the thicker border */
      }
      .theme-swatches {
        display: flex;
        gap: 4px;
        margin-bottom: 8px;
      }
      .theme-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }
      .theme-name {
        font-size: 12.5px;
        font-weight: 500;
      }
      .theme-desc {
        font-size: 10.5px;
        line-height: 1.35;
        margin-top: 2px;
      }

      .prefs-panel {
        width: 640px;
        padding-top: 4px;
      }
      .prefs-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 18px;
        margin: 0 6px;
        border-radius: 8px;
      }
      .prefs-row:hover {
        background: var(--bg-hover);
      }
      .prefs-row-text {
        flex: 1 1 auto;
        min-width: 0;
      }
      .prefs-row-label {
        font-size: 13px;
        font-weight: 500;
        color: var(--text);
      }
      .prefs-row-desc {
        font-size: 11.5px;
        color: var(--text-faint);
        margin-top: 2px;
      }
      .prefs-row-combo {
        flex: 0 0 auto;
        min-width: 90px;
        text-align: right;
        font-family: "JetBrains Mono", Menlo, monospace;
        font-size: 12px;
        font-weight: 500;
        color: var(--accent);
        white-space: nowrap;
      }
      .prefs-row-recording .prefs-row-combo {
        font-family: var(--font-ui);
        color: var(--warning);
        font-style: italic;
        font-weight: 400;
      }
      .prefs-btn {
        flex: 0 0 auto;
        font-family: inherit;
        font-size: 11.5px;
        font-weight: 500;
        color: var(--text-dim);
        background: transparent;
        border: none;
        border-radius: 6px;
        padding: 5px 10px;
        cursor: pointer;
        transition: color 0.12s ease, background 0.12s ease;
      }
      .prefs-btn:hover {
        color: var(--text);
        background: var(--bg-hover);
      }
      .prefs-btn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .prefs-btn:disabled:hover {
        color: var(--text-dim);
        background: transparent;
      }

      .prefs-range {
        flex: 0 0 130px;
        accent-color: var(--accent);
      }
      .prefs-select,
      .prefs-text,
      .prefs-number {
        flex: 0 0 auto;
        font-family: inherit;
        font-size: 12px;
        color: var(--text);
        background: var(--bg-hover);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 4px 6px;
        accent-color: var(--accent);
      }
      .prefs-number {
        width: 56px;
      }
      .prefs-text {
        flex: 0 1 200px;
        min-width: 0;
        font-family: var(--font-mono);
        font-size: 11.5px;
        outline: none;
      }
      .prefs-text:focus {
        border-color: var(--accent);
      }
      .prefs-error {
        color: var(--danger);
      }
      .prefs-footer {
        border-top: 1px solid var(--border);
        margin: 10px 6px 0;
        padding: 12px 12px 0;
        display: flex;
        justify-content: flex-end;
      }

      /* ── Source control panel (beta) ─────────────────────────────────
         The sidebar's twin on the right: same surface, same hairline, grip on
         its left edge. Sized by --vcs-width from vcsPanel.js. */
      #vcs {
        flex: 0 0 var(--vcs-width, 320px);
        min-height: 0;
        overflow-y: auto;
        background: var(--surface);
        border-left: 1px solid var(--border);
        padding: 6px 0 12px;
        box-sizing: border-box;
        font-size: 12px;
        color: var(--text-dim);
      }
      #vcs.hidden {
        display: none;
      }
      #vcs-grip {
        flex: 0 0 4px;
        cursor: col-resize;
        background: transparent;
        transition: background 0.12s ease;
      }
      #vcs-grip:hover,
      #vcs-grip.is-dragging {
        background: var(--accent);
      }
      #vcs-grip.hidden {
        display: none;
      }
      .vcs-head {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px 6px;
      }
      .vcs-title {
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-faint);
      }
      .vcs-head-spacer {
        flex: 1 1 auto;
      }
      .vcs-beta {
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--warning);
        border: 1px solid var(--warning);
        border-radius: 3px;
        padding: 0 4px;
        cursor: help;
      }
      .vcs-view {
        display: inline-flex;
        gap: 2px;
      }
      .vcs-repo {
        padding: 0 14px;
        font-family: var(--font-display);
        font-size: 16px;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .vcs-branch {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 2px 14px 6px;
        min-width: 0;
      }
      .vcs-branch-icon {
        color: var(--accent);
      }
      .vcs-branch-name {
        font-family: var(--font-mono);
        font-size: 11.5px;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .vcs-detached {
        color: var(--warning);
      }
      .vcs-ab {
        flex: 0 0 auto;
        font-family: var(--font-mono);
        font-size: 10.5px;
        padding: 0 4px;
        border-radius: 3px;
        background: var(--bg-hover);
      }
      .vcs-ab-ahead {
        color: var(--accent);
      }
      .vcs-ab-behind {
        color: var(--warning);
      }
      .vcs-upstream {
        flex: 1 1 auto;
        min-width: 0;
        text-align: right;
        font-size: 10.5px;
        color: var(--text-faint);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .vcs-upstream-none {
        font-style: italic;
      }
      .vcs-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 12px 6px;
      }
      .vcs-actions-spacer {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .vcs-menu-wrap {
        position: relative;
        flex: 0 0 auto;
      }
      .vcs-btn-menu {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        flex: 0 0 auto;
      }
      .vcs-btn-menu-open {
        color: var(--text);
        border-color: var(--text-faint);
      }
      .vcs-menu-summary {
        font-family: var(--font-mono);
        font-size: 10.5px;
        color: var(--accent);
      }
      .vcs-menu-chevron svg {
        width: 11px;
        height: 11px;
        display: block;
      }
      .vcs-menu {
        position: absolute;
        top: calc(100% + 4px);
        right: 0;
        z-index: 20;
        min-width: 230px;
        padding: 4px;
        background: var(--bg-raised);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }
      .vcs-menu-item {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 6px 8px;
        font-family: inherit;
        font-size: 11.5px;
        color: var(--text);
        background: transparent;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        text-align: left;
      }
      .vcs-menu-item:hover {
        background: var(--bg-hover);
      }
      .vcs-menu-item:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .vcs-menu-item:disabled:hover {
        background: transparent;
      }
      .vcs-menu-icon {
        flex: 0 0 auto;
        display: inline-flex;
        color: var(--text-dim);
      }
      .vcs-menu-label {
        flex: 0 0 auto;
      }
      .vcs-menu-label b {
        font-weight: 600;
        color: var(--accent);
      }
      .vcs-menu-hint {
        flex: 1 1 auto;
        min-width: 0;
        text-align: right;
        font-size: 10px;
        color: var(--text-faint);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .vcs-menu-sep {
        height: 1px;
        margin: 3px 6px;
        background: var(--border);
      }
      /* Icon buttons: one stroke glyph, sized to the row. */
      .vcs-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        padding: 0;
      }
      #vcs svg {
        width: 13px;
        height: 13px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        display: block;
      }
      .vcs-btn {
        flex: 1 1 auto;
        font-family: inherit;
        font-size: 11px;
        font-weight: 500;
        color: var(--text-dim);
        background: var(--bg-hover);
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 4px 8px;
        cursor: pointer;
        white-space: nowrap;
        transition: color 0.12s ease, background 0.12s ease;
      }
      .vcs-btn:hover {
        color: var(--text);
        border-color: var(--text-faint);
      }
      .vcs-btn:disabled,
      .vcs-btn:disabled:hover {
        opacity: 0.4;
        cursor: default;
        color: var(--text-dim);
        border-color: var(--border);
      }
      .vcs-btn-icon {
        flex: 0 0 auto;
      }
      .vcs-btn-primary {
        color: var(--bg);
        background: var(--accent);
        border-color: var(--accent);
      }
      .vcs-btn-primary:hover {
        color: var(--bg);
        filter: brightness(1.08);
      }
      .vcs-btn-primary:disabled,
      .vcs-btn-primary:disabled:hover {
        color: var(--bg);
        background: var(--accent);
        border-color: var(--accent);
        filter: none;
      }
      .vcs-commit-box {
        margin: 0 12px 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        overflow: hidden;
      }
      .vcs-textarea,
      .vcs-input {
        display: block;
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        font-family: var(--font-mono);
        font-size: 11.5px;
        line-height: 1.4;
        color: var(--text);
        background: transparent;
        border: none;
        outline: none;
        resize: vertical;
      }
      .vcs-input {
        padding: 3px 6px;
        border: 1px solid var(--accent);
        border-radius: 4px;
        background: var(--bg);
      }
      .vcs-commit-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        padding: 4px 6px 4px 8px;
        border-top: 1px solid var(--border);
      }
      .vcs-commit-foot .vcs-btn {
        flex: 0 0 auto;
      }
      .vcs-hint {
        font-size: 10.5px;
        color: var(--text-faint);
      }
      .vcs-banner {
        margin: 0 12px 6px;
        padding: 6px 8px;
        border-radius: 6px;
        font-size: 11px;
        line-height: 1.4;
        color: var(--text);
        background: var(--bg-hover);
        border-left: 2px solid var(--warning);
      }
      .vcs-banner code {
        font-family: var(--font-mono);
        font-size: 10.5px;
      }
      .vcs-result {
        position: relative;
        margin: 0 12px 6px;
        padding: 5px 24px 5px 8px;
        border-radius: 6px;
        background: var(--bg-hover);
        border-left: 2px solid var(--success);
      }
      .vcs-result-error {
        border-left-color: var(--danger);
      }
      .vcs-result pre {
        margin: 0;
        font-family: var(--font-mono);
        font-size: 10.5px;
        line-height: 1.4;
        color: var(--text-dim);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        max-height: 140px;
        overflow-y: auto;
      }
      .vcs-result-error pre {
        color: var(--danger);
      }
      .vcs-result .vcs-mini {
        position: absolute;
        top: 3px;
        right: 4px;
      }
      .vcs-section {
        margin-top: 4px;
        padding-top: 4px;
        border-top: 1px solid var(--border);
      }
      .vcs-section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        padding: 4px 12px 2px;
      }
      .vcs-section-title {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-faint);
        cursor: pointer;
        user-select: none;
      }
      .vcs-count {
        font-weight: 500;
        letter-spacing: 0;
        color: var(--text-faint);
        background: var(--bg-hover);
        border-radius: 3px;
        padding: 0 4px;
      }
      .vcs-legend {
        font-size: 10.5px;
        color: var(--text-faint);
      }
      .vcs-caret {
        display: inline-block;
        width: 10px;
        font-size: 9px;
        color: var(--text-faint);
      }
      .vcs-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 0 6px;
        padding: 3px 6px 3px calc(6px + var(--depth, 0) * 12px);
        border-radius: 5px;
        min-width: 0;
      }
      .vcs-file,
      .vcs-dir,
      .vcs-commit,
      .vcs-stash {
        cursor: pointer;
      }
      .vcs-file:hover,
      .vcs-dir:hover,
      .vcs-commit:hover,
      .vcs-stash:hover {
        background: var(--bg-hover);
        color: var(--text);
      }
      .vcs-file-open {
        color: var(--text);
      }
      .vcs-status {
        flex: 0 0 14px;
        font-family: var(--font-mono);
        font-size: 10.5px;
        font-weight: 700;
        text-align: center;
        color: var(--text-faint);
      }
      .vcs-status-M,
      .vcs-status-T {
        color: var(--warning);
      }
      .vcs-status-A,
      .vcs-status-U {
        color: var(--success);
      }
      .vcs-status-D {
        color: var(--danger);
      }
      .vcs-status-R,
      .vcs-status-C {
        color: var(--accent);
      }
      .vcs-file-label {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        align-items: baseline;
        gap: 4px;
        font-family: var(--font-mono);
        font-size: 11px;
        overflow: hidden;
        white-space: nowrap;
      }
      .vcs-file-dir {
        flex: 0 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--text-faint);
        direction: rtl;
        text-align: left;
      }
      .vcs-file-name {
        flex: 0 0 auto;
      }
      .vcs-file-from {
        flex: 0 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 10px;
        color: var(--text-faint);
      }
      .vcs-dir-name {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-faint);
      }
      .vcs-row-actions {
        flex: 0 0 auto;
        display: inline-flex;
        gap: 2px;
        visibility: hidden;
      }
      .vcs-row:hover .vcs-row-actions,
      .vcs-row-actions:focus-within {
        visibility: visible;
      }
      .vcs-mini {
        flex: 0 0 auto;
        padding: 0 5px;
        font-family: inherit;
        font-size: 11px;
        line-height: 1.5;
        color: var(--text-faint);
        background: transparent;
        border: 1px solid transparent;
        border-radius: 4px;
        cursor: pointer;
      }
      .vcs-mini:hover {
        color: var(--text);
        background: var(--bg-hover);
        border-color: var(--border);
      }
      .vcs-mini:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .vcs-mini-danger:hover {
        color: var(--danger);
      }
      .vcs-mini-on {
        color: var(--text);
        background: var(--bg-hover);
        border-color: var(--border);
      }
      .vcs-confirm {
        background: var(--bg-hover);
      }
      .vcs-confirm-text {
        flex: 1 1 auto;
        min-width: 0;
        font-size: 11px;
        color: var(--text);
        overflow-wrap: anywhere;
      }
      .vcs-stash-form {
        gap: 4px;
      }
      .vcs-stash-form .vcs-input {
        flex: 1 1 auto;
        min-width: 0;
      }
      .vcs-diff-wrap {
        margin: 0 6px 4px calc(6px + var(--depth, 0) * 12px);
        border: 1px solid var(--border);
        border-radius: 5px;
        background: var(--bg);
        overflow: auto;
        max-height: 320px;
      }
      .vcs-diff {
        font-family: var(--font-mono);
        font-size: 10.5px;
        line-height: 1.45;
        min-width: max-content;
      }
      .vcs-diff-line {
        padding: 0 8px;
        white-space: pre;
      }
      .vcs-diff-add {
        color: var(--success);
        background: color-mix(in srgb, var(--success) 12%, transparent);
      }
      .vcs-diff-del {
        color: var(--danger);
        background: color-mix(in srgb, var(--danger) 12%, transparent);
      }
      .vcs-diff-hunk {
        color: var(--accent);
        background: var(--bg-hover);
        margin-top: 2px;
      }
      .vcs-diff-ctx {
        color: var(--text-dim);
      }
      .vcs-diff-meta {
        color: var(--text-faint);
        font-style: italic;
      }
      .vcs-diff-empty {
        padding: 6px 8px;
        font-size: 10.5px;
        color: var(--text-faint);
      }
      .vcs-commit-mark {
        flex: 0 0 auto;
        font-size: 8px;
        color: var(--text-faint);
      }
      .vcs-commit-local .vcs-commit-mark,
      .vcs-commit-mark-local {
        color: var(--accent);
      }
      .vcs-commit-local {
        color: var(--text);
      }
      .vcs-commit-hash {
        flex: 0 0 auto;
        font-family: var(--font-mono);
        font-size: 10.5px;
        color: var(--text-faint);
      }
      .vcs-commit-subject {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .vcs-commit-time {
        flex: 0 0 auto;
        font-size: 10px;
        color: var(--text-faint);
      }
      .vcs-tag {
        flex: 0 0 auto;
        font-size: 9px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        border-radius: 3px;
        padding: 0 4px;
        background: var(--bg-hover);
        color: var(--text-faint);
      }
      .vcs-tag-local {
        color: var(--accent);
        border: 1px solid var(--accent);
        background: transparent;
      }
      .vcs-empty {
        padding: 4px 14px;
        font-size: 11.5px;
        color: var(--text-faint);
      }
      .vcs-empty-big {
        padding: 18px 14px 6px;
        font-size: 12px;
      }
      .vcs-error {
        margin: 2px 6px 0;
        padding: 5px 8px;
        border-radius: 6px;
        font-size: 11px;
        color: var(--danger);
        background: var(--bg-hover);
        overflow-wrap: anywhere;
      }
      .vcs-footnote {
        margin-top: 10px;
        padding: 6px 14px 0;
        border-top: 1px solid var(--border);
        font-size: 10px;
        line-height: 1.4;
        color: var(--text-faint);
      }

      /* A transcript in the sidebar: what the worktree setup script printed. */
      .sidebar-note {
        position: relative;
        margin: 2px 6px 0;
        padding: 5px 22px 5px 8px;
        border-radius: 6px;
        background: var(--bg-hover);
        border-left: 2px solid var(--success);
      }
      .sidebar-note pre {
        margin: 0;
        font-family: var(--font-mono);
        font-size: 10.5px;
        line-height: 1.4;
        color: var(--text-dim);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        max-height: 120px;
        overflow-y: auto;
      }
      .sidebar-note .sidebar-icon-btn {
        position: absolute;
        top: 2px;
        right: 2px;
      }
      /* A preference whose control wants the whole width: label above, box below. */
      .prefs-row-stacked {
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
      }
      .prefs-textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        font-family: var(--font-mono);
        font-size: 11.5px;
        line-height: 1.4;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        outline: none;
        resize: vertical;
      }
      .prefs-textarea:focus {
        border-color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div id="backdrop"></div>
    <div id="tabbar"></div>
    <!-- Siblings in a flex row, not stacked layers: opening the sidebar
         takes width from the terminals rather than covering them. -->
    <div id="workspace">
      <aside id="sidebar" class="hidden"></aside>
      <!-- A sibling, not a child: the sidebar rewrites its own innerHTML on
           every poll, which would take a child grip with it. -->
      <div id="sidebar-grip" class="hidden"></div>
      <div id="panes"></div>
      <!-- Source control, on the right. Same arrangement as the sidebar,
           mirrored: grip first, since it sits on the panel's left edge. -->
      <div id="vcs-grip" class="hidden"></div>
      <aside id="vcs" class="hidden"></aside>
    </div>
    <!-- Classic scripts, not modules: both set globals the module below
         reads, so they must finish executing first. -->
    <script src="./vendor/xterm/xterm.js"></script>
    <script src="./vendor/xterm/addon-fit.js"></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
