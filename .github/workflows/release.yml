name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to increment"
        type: choice
        default: patch
        options: [patch, minor, major, none]
      version:
        description: "Exact version instead, e.g. 0.4.0"
        required: false
        type: string

permissions:
  contents: write

env:
  GO_VERSION: "1.25"
  ELIXIR_VERSION: "1.18"
  OTP_VERSION: "27"
  WAILS_VERSION: v2.13.0

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - id: tag
        env:
          BUMP: ${{ inputs.bump }}
          EXACT: ${{ inputs.version }}
        run: |
          current="$(tr -d '[:space:]' < VERSION)"
          version="$current"

          if [ -n "$EXACT" ]; then
            version="${EXACT#v}"
          elif [ -n "$BUMP" ] && [ "$BUMP" != none ]; then
            major="${current%%.*}"
            rest="${current#*.}"
            minor="${rest%%.*}"
            patch="${rest##*.}"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            version="$major.$minor.$patch"
          fi

          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$version' is not a version like 0.2.0"; exit 1 ;;
          esac

          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($current)"
            exit 1
          fi

          printf '%s\n' "$version" > VERSION
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "$current -> $version" >> "$GITHUB_STEP_SUMMARY"

      - if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            if git diff --quiet VERSION; then
              echo "$TAG already exists — rebuilding it."
              exit 0
            fi
            echo "::error::$TAG already exists — pick another version"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet VERSION; then
            git commit -m "release $TAG" VERSION
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          git tag "$TAG"
          git push origin "$TAG"

      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" --title "Meerkat ${TAG#v}" --generate-notes
          fi

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: darwin-arm64
          - runner: macos-13
            target: darwin-amd64
          - runner: ubuntu-24.04
            target: linux-amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - if: runner.os == 'Linux'
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - if: runner.os == 'macOS'
        run: brew install elixir

      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
          echo "WAILS_TAGS=webkit2_41" >> "$GITHUB_ENV"

      - run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Gatekeeper refuses unsigned, un-notarized code that arrives with a
      # browser's quarantine flag on it, which is every .dmg anyone downloads.
      # So the macOS runners need a Developer ID certificate in a keychain
      # before the build, or the disk image they produce cannot be opened.
      #
      # With the secrets unset this is a no-op and release.sh still ships an
      # unsigned .dmg — fine for a fork or a dry run, not fine to publish.
      - if: runner.os == 'macOS'
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          if [ -z "$CERTIFICATE" ] || [ -z "$SIGN_IDENTITY" ]; then
            echo "::warning::No signing certificate — the .dmg will be unsigned and macOS will refuse to open it."
            exit 0
          fi

          # A keychain of its own, unlocked for this job only. The runner is
          # ephemeral, so the password only has to be unguessable within the run.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"

          # Without this codesign stops for a GUI prompt that nothing on a
          # runner can answer, and the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

          # Prepended, not replaced: the login keychain still holds Apple's
          # intermediate certificates, and dropping it breaks chain validation.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          echo "MEERKAT_SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"

      - env:
          GH_TOKEN: ${{ github.token }}
          MEERKAT_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MEERKAT_APPLE_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MEERKAT_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: ./scripts/release.sh --publish

      - uses: actions/upload-artifact@v5
        with:
          name: meerkat-${{ matrix.target }}
          path: meerkat-site/public/downloads/latest/
