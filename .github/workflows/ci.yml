name: ci

# Checks every piece of Meerkat on every push and pull request: the terminal
# app (Go + the page's JavaScript), the command line (Go), the engine (Elixir)
# and the site (JavaScript). release.yml calls this workflow before it tags
# anything, so a release is never cut from a commit that does not pass here.
on:
  push:
    branches: ["**"]
    # Tag pushes belong to release.yml, which runs this workflow itself.
    tags-ignore: ["v*"]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "22"
  ELIXIR_VERSION: "1.18"
  OTP_VERSION: "27"
  # The Linux Wails build links against WebKitGTK 4.1 (see release.yml).
  WAILS_TAGS: webkit2_41

jobs:
  # meerkat-app: the Go side of the Wails app. `go vet` and `go test` both
  # compile the cgo bindings, so the GTK and WebKit headers have to be there.
  app-go:
    name: app · go
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: meerkat-app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: meerkat-app/go.sum

      - run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would reformat:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet -tags "$WAILS_TAGS" ./...

      - name: go test
        run: go test -tags "$WAILS_TAGS" ./...

  # meerkat-app/frontend: plain ES modules, no bundler. The type check runs
  # TypeScript over the JavaScript (jsconfig.json, checkJs), with the Wails
  # and xterm globals declared in types.d.ts.
  app-frontend:
    name: app · frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: meerkat-app/frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: syntax
        run: |
          for f in main.js js/*.js; do node --check "$f"; done

      - name: typecheck
        run: npx -y -p typescript@5 tsc -p jsconfig.json

  # meerkat-client: the command line.
  client-go:
    name: client · go
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: meerkat-client
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: meerkat-client/go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would reformat:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  # meerkat-daemon: the engine. Elixir 1.18's compiler is the type checker —
  # type violations come out as warnings, which --warnings-as-errors turns
  # into failures. erlexec builds a C++ port program on deps.get, hence the
  # deps/_build cache keyed on mix.lock.
  daemon-elixir:
    name: daemon · elixir
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: meerkat-daemon
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: actions/cache@v4
        with:
          path: |
            meerkat-daemon/deps
            meerkat-daemon/_build
          key: mix-${{ runner.os }}-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('meerkat-daemon/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - run: mix deps.get

      - name: format
        run: mix format --check-formatted

      - name: compile (typecheck)
        run: mix compile --warnings-as-errors

      - name: test
        run: mix test

  # meerkat-site: the landing page. A build is the check — Vite resolves every
  # import and fails on anything broken.
  site:
    name: site · build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: meerkat-site
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: meerkat-site/package-lock.json

      - run: npm ci

      - run: npm run build
