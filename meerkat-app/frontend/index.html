<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Meerkat</title>
    <!-- Vendored, not CDN: a terminal that won't draw its glyphs offline is
         broken. Refresh with scripts/vendor-fonts.sh. -->
    <link rel="stylesheet" href="./vendor/xterm/xterm.css" />
    <link rel="stylesheet" href="./vendor/fonts/fonts.css" />
    <style>
      /* The "Clay" preset, inlined so the first paint is themed; themes.js
         overwrites all of it at runtime. No rule below may hardcode a color
         a preset would need to change. */
      :root {
        --bg: #1b1917;
        --bg-raised: #232120;
        --bg-hover: rgba(245, 242, 234, 0.06);
        --border: rgba(245, 242, 234, 0.09);
        --text: #f5f2ea;
        --text-dim: #a09a90;
        --text-faint: #6b655d;
        --accent: #d97757;
        --danger: #f08a72;
        --warning: #d9a94d;
        --backdrop: rgba(18, 16, 15, 0.62);

        --font-ui: "DM Sans", -apple-system, "Helvetica Neue", sans-serif;
        --font-display: "Instrument Serif", Georgia, serif;

        /* Written by appearance.js; these defaults are the fully-opaque
           case, so first paint is correct before JS runs. */
        --surface: #1b1917;
        --surface-raised: #232120;
        --font-mono: "JetBrains Mono", Menlo, monospace;
        --bg-image: url("/assets/meerkat-logo.png");
        --bg-image-size: 220px auto;
      }

      html,
      body {
        margin: 0;
        /* 100dvh, not 100%: during a macOS fullscreen transition a
           percentage resolves against a stale containing block and clips
           the terminal's last row. */
        height: 100dvh;
        /* Also stops WebKit's backdrop-filter blur from bleeding past the
           overlay's box and scrolling the whole window behind the modal. */
        overflow: hidden;
        /* Transparent, not --bg: the window is created translucent, so
           anything painted here would be an extra opaque layer under every
           surface and defeat the opacity setting. */
        background: transparent;
        font-family: var(--font-ui);
        -webkit-font-smoothing: antialiased;
      }
      body {
        display: flex;
        flex-direction: column;
      }

      /* Behind everything and out of layout; the translucent surfaces
         composite over it. The low opacity is deliberate and not
         user-adjustable — this sits directly behind terminal text, and
         anything busier than a faint wash makes output unreadable. */
      #backdrop {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-image: var(--bg-image);
        background-size: var(--bg-image-size);
        background-repeat: no-repeat;
        background-position: center;
        opacity: 0.14;
        pointer-events: none;
      }

      #tabbar {
        display: flex;
        flex: 0 0 auto;
        align-items: flex-end;
        gap: 2px;
        padding: 10px 10px 0;
        background: var(--surface);
        -webkit-app-region: drag;
        min-height: 44px;
        box-sizing: border-box;
      }
      .tab {
        -webkit-app-region: no-drag;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        font-size: 13px;
        font-weight: 500;
        color: var(--text-dim);
        border-radius: 6px 6px 0 0;
        cursor: pointer;
        user-select: none;
        transition: color 0.12s ease, background 0.12s ease;
      }
      .tab:hover {
        color: var(--text);
        background: var(--bg-hover);
      }
      .tab.active {
        color: var(--text);
        background: var(--surface-raised);
        box-shadow: inset 0 -2px 0 var(--accent);
      }
      .tab-badge {
        font-size: 10px;
        font-weight: 500;
        color: var(--text-faint);
        background: var(--bg-hover);
        border-radius: 4px;
        padding: 1px 5px;
      }
      .tab-close {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 18px;
        height: 18px;
        border-radius: 4px;
        font-size: 14px;
        line-height: 1;
        color: var(--text-faint);
      }
      .tab-close:hover {
        color: var(--danger);
        background: var(--bg-hover);
      }

      #workspace {
        display: flex;
        flex: 1 1 auto;
        min-height: 0;
      }

      #sidebar {
        flex: 0 0 250px;
        min-height: 0;
        overflow-y: auto;
        background: var(--surface);
        border-right: 1px solid var(--border);
        padding: 6px 0 12px;
        box-sizing: border-box;
      }
      #sidebar.hidden {
        display: none;
      }
      .sidebar-section + .sidebar-section {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--border);
      }
      .sidebar-heading {
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-faint);
        padding: 6px 14px;
      }
      .sidebar-row {
        margin: 0 6px;
        padding: 6px 8px;
        border-radius: 6px;
        font-size: 12px;
        color: var(--text-dim);
      }
      .sidebar-empty {
        padding: 4px 14px;
        font-size: 11.5px;
        color: var(--text-faint);
      }
      .sidebar-session {
        display: flex;
        align-items: center;
        gap: 7px;
        cursor: pointer;
      }
      .sidebar-session:hover {
        background: var(--bg-hover);
        color: var(--text);
      }
      .sidebar-session-active {
        color: var(--text);
      }
      .sidebar-marker {
        flex: 0 0 auto;
        font-size: 8px;
        color: var(--accent);
      }
      /* Clips from the left, so the meaningful tail of a long path survives
         rather than the "/Users/..." prefix every row shares. */
      .sidebar-label {
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        direction: rtl;
        text-align: left;
      }
      .sidebar-heading-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }
      .sidebar-icon-btn {
        flex: 0 0 auto;
        padding: 1px 6px;
        font-family: inherit;
        font-size: 11px;
        line-height: 1.5;
        color: var(--text-faint);
        background: transparent;
        border: 1px solid transparent;
        border-radius: 4px;
        cursor: pointer;
      }
      .sidebar-icon-btn:hover {
        color: var(--text);
        background: var(--bg-hover);
        border-color: var(--border);
      }
      .sidebar-icon-danger:hover {
        color: var(--danger);
      }

      .sidebar-worktree {
        display: flex;
        align-items: center;
        gap: 7px;
        cursor: pointer;
      }
      .sidebar-worktree:hover {
        background: var(--bg-hover);
        color: var(--text);
      }
      .sidebar-worktree-active {
        color: var(--text);
      }
      .wt-name {
        flex: 0 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* Only shown when it adds something the directory name doesn't. */
      .wt-branch {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 11px;
        color: var(--text-faint);
        text-align: right;
      }
      .wt-tag {
        flex: 0 0 auto;
        font-size: 9.5px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--text-faint);
        background: var(--bg-hover);
        border-radius: 3px;
        padding: 1px 4px;
      }
      .wt-tag-dirty {
        color: var(--warning);
        background: transparent;
        font-size: 8px;
        padding: 0;
      }
      .wt-tag-stale {
        color: var(--danger);
      }
      /* Kept out of the layout until hover so the row doesn't reflow, and so a
         mis-aimed click on a resting row can't start a removal. */
      .wt-remove {
        visibility: hidden;
      }
      .sidebar-worktree:hover .wt-remove {
        visibility: visible;
      }
      .sidebar-worktree-confirm {
        display: flex;
        align-items: center;
        gap: 4px;
        background: var(--bg-hover);
      }
      .wt-confirm-text {
        flex: 1 1 auto;
        min-width: 0;
        font-size: 11px;
        color: var(--text);
      }
      .wt-input {
        width: 100%;
        box-sizing: border-box;
        padding: 3px 6px;
        font-family: var(--font-mono);
        font-size: 11.5px;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--accent);
        border-radius: 4px;
        outline: none;
      }
      .sidebar-hint {
        padding: 2px 14px 4px;
        font-size: 10.5px;
        color: var(--text-faint);
        overflow-wrap: anywhere;
      }
      .sidebar-error {
        margin: 2px 6px 0;
        padding: 5px 8px;
        border-radius: 6px;
        font-size: 11px;
        color: var(--danger);
        background: var(--bg-hover);
        overflow-wrap: anywhere;
      }

      .sidebar-job-top {
        display: flex;
        align-items: baseline;
        gap: 6px;
      }
      .sidebar-job .job-cmd {
        display: block;
        margin-top: 2px;
        font-family: "JetBrains Mono", Menlo, monospace;
        font-size: 11px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #panes {
        position: relative;
        flex: 1 1 auto;
        min-width: 0;
        min-height: 0;
        /* The single layer carrying the terminal area's tint (see
           appearance.js). The xterm canvases above are fully transparent, and
           this spans the pane, covering the few pixels xterm's whole-cell
           canvas sizing leaves along the right/bottom edge. */
        background: var(--surface-raised);
      }
      /* One per tab; sessionManager toggles display flex/none. */
      .tab-pane-root {
        position: absolute;
        inset: 0;
        display: flex;
      }

      /* min-width/min-height: 0 is load-bearing: flex items default to
         min-content sizing, which would stop a terminal shrinking below its
         longest output line and overflow the split. */
      .split {
        display: flex;
        flex: 1 1 0;
        min-width: 0;
        min-height: 0;
      }
      .split-row {
        flex-direction: row;
      }
      .split-column {
        flex-direction: column;
      }
      .split-child {
        display: flex;
        min-width: 0;
        min-height: 0;
      }

      .divider {
        flex: 0 0 5px;
        background: var(--border);
        transition: background 0.12s ease;
      }
      .divider:hover,
      body.dragging-divider .divider {
        background: var(--accent);
      }
      .divider-row {
        cursor: col-resize;
      }
      .divider-column {
        cursor: row-resize;
      }
      /* Stops cursor flicker and text selection mid-drag. */
      body.dragging-divider {
        user-select: none;
      }
      body.dragging-divider * {
        cursor: inherit !important;
      }

      /* Minimal inset: padding here is dead space the terminal grid can't
         use, and more of it reads as a frame. */
      .pane {
        flex: 1 1 0;
        min-width: 0;
        min-height: 0;
        position: relative;
        padding: 6px 0 0 10px;
        box-sizing: border-box;
      }
      /* Shown in place of a terminal when the daemon can't be reached. */
      .pane-error {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        gap: 10px;
        padding: 0 40px;
        max-width: 620px;
        margin: 0 auto;
      }
      .pane-error-title {
        font-family: var(--font-display);
        font-size: 22px;
        color: var(--text);
      }
      .pane-error-detail {
        font-family: "JetBrains Mono", Menlo, monospace;
        font-size: 12px;
        color: var(--danger);
        word-break: break-word;
      }
      .pane-error-hint {
        font-size: 12.5px;
        line-height: 1.6;
        color: var(--text-dim);
      }
      .pane-error code {
        font-family: "JetBrains Mono", Menlo, monospace;
        font-size: 11.5px;
        background: var(--bg-hover);
        border-radius: 4px;
        padding: 1px 5px;
      }

      /* inset rather than a real border, so adding it doesn't change the
         pane's box and reflow the terminal. */
      .pane-focused {
        box-shadow: inset 0 0 0 1px var(--accent);
        border-radius: 4px;
      }

      #prefs-overlay {
        /* fixed, not absolute: absolute made the modal's size depend on the
           page box, letting the blurred backdrop feed back into the
           document's own scroll height. */
        position: fixed;
        inset: 0;
        background: var(--backdrop);
        backdrop-filter: blur(6px);
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding-top: 64px;
        z-index: 10;
      }
      #prefs-overlay.hidden {
        display: none;
      }
      .overlay-panel {
        background: var(--bg-raised);
        border-radius: 14px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        width: 480px;
        max-width: 90%;
        max-height: 70vh;
        overflow-y: auto;
        padding: 8px 0 14px;
      }
      .overlay-heading {
        font-family: var(--font-display);
        color: var(--text);
        font-size: 18px;
        font-weight: 400;
        letter-spacing: 0.01em;
        padding: 14px 18px 8px;
      }
      .job-id {
        color: var(--text-faint);
        font-weight: 500;
      }
      .job-status {
        color: var(--accent);
        margin: 0 8px;
      }
      .job-mem {
        color: var(--text-dim);
        margin-right: 8px;
      }
      .job-cmd {
        color: var(--text-dim);
      }

      /* Each card paints itself in its own preset's colors, set inline from
         themes.js — so this grid uses no --token colors of its own. */
      .theme-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        padding: 4px 18px 10px;
      }
      .theme-card {
        border: 1px solid;
        border-radius: 10px;
        padding: 10px 12px;
        cursor: pointer;
        transition: transform 0.12s ease;
      }
      .theme-card:hover {
        transform: translateY(-1px);
      }
      .theme-card-active {
        border-width: 2px;
        padding: 9px 11px; /* offsets the thicker border */
      }
      .theme-swatches {
        display: flex;
        gap: 4px;
        margin-bottom: 8px;
      }
      .theme-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }
      .theme-name {
        font-size: 12.5px;
        font-weight: 500;
      }
      .theme-desc {
        font-size: 10.5px;
        line-height: 1.35;
        margin-top: 2px;
      }

      .prefs-panel {
        width: 640px;
        padding-top: 4px;
      }
      .prefs-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 18px;
        margin: 0 6px;
        border-radius: 8px;
      }
      .prefs-row:hover {
        background: var(--bg-hover);
      }
      .prefs-row-text {
        flex: 1 1 auto;
        min-width: 0;
      }
      .prefs-row-label {
        font-size: 13px;
        font-weight: 500;
        color: var(--text);
      }
      .prefs-row-desc {
        font-size: 11.5px;
        color: var(--text-faint);
        margin-top: 2px;
      }
      .prefs-row-combo {
        flex: 0 0 auto;
        min-width: 90px;
        text-align: right;
        font-family: "JetBrains Mono", Menlo, monospace;
        font-size: 12px;
        font-weight: 500;
        color: var(--accent);
        white-space: nowrap;
      }
      .prefs-row-recording .prefs-row-combo {
        font-family: var(--font-ui);
        color: var(--warning);
        font-style: italic;
        font-weight: 400;
      }
      .prefs-btn {
        flex: 0 0 auto;
        font-family: inherit;
        font-size: 11.5px;
        font-weight: 500;
        color: var(--text-dim);
        background: transparent;
        border: none;
        border-radius: 6px;
        padding: 5px 10px;
        cursor: pointer;
        transition: color 0.12s ease, background 0.12s ease;
      }
      .prefs-btn:hover {
        color: var(--text);
        background: var(--bg-hover);
      }
      .prefs-btn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .prefs-btn:disabled:hover {
        color: var(--text-dim);
        background: transparent;
      }

      .prefs-range {
        flex: 0 0 130px;
        accent-color: var(--accent);
      }
      .prefs-select,
      .prefs-text,
      .prefs-number {
        flex: 0 0 auto;
        font-family: inherit;
        font-size: 12px;
        color: var(--text);
        background: var(--bg-hover);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 4px 6px;
        accent-color: var(--accent);
      }
      .prefs-number {
        width: 56px;
      }
      .prefs-text {
        flex: 0 1 200px;
        min-width: 0;
        font-family: var(--font-mono);
        font-size: 11.5px;
        outline: none;
      }
      .prefs-text:focus {
        border-color: var(--accent);
      }
      .prefs-error {
        color: var(--danger);
      }
      .prefs-footer {
        border-top: 1px solid var(--border);
        margin: 10px 6px 0;
        padding: 12px 12px 0;
        display: flex;
        justify-content: flex-end;
      }
    </style>
  </head>
  <body>
    <div id="backdrop"></div>
    <div id="tabbar"></div>
    <!-- Siblings in a flex row, not stacked layers: opening the sidebar
         takes width from the terminals rather than covering them. -->
    <div id="workspace">
      <aside id="sidebar" class="hidden"></aside>
      <div id="panes"></div>
    </div>
    <!-- Classic scripts, not modules: both set globals the module below
         reads, so they must finish executing first. -->
    <script src="./vendor/xterm/xterm.js"></script>
    <script src="./vendor/xterm/addon-fit.js"></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
