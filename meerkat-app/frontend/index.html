<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Meerkat</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5/css/xterm.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Instrument+Serif&family=JetBrains+Mono:wght@500;700&display=swap"
    />
    <style>
      /* Warm near-black + cream palette. The greys are all warm-tinted
         (brown-leaning) rather than neutral, and the accent is terracotta
         — the same family the terminal grid uses (see theme.js), so the
         xterm canvas and the DOM chrome around it read as one surface. */
      :root {
        --bg: #1b1917;
        --bg-raised: #232120;
        --bg-hover: rgba(245, 242, 234, 0.06);
        --border: rgba(245, 242, 234, 0.09);
        --text: #f5f2ea;
        --text-dim: #a09a90;
        --text-faint: #6b655d;
        --accent: #d97757;

        --font-ui: "DM Sans", -apple-system, "Helvetica Neue", sans-serif;
        /* Reserved for panel titles — the reference pairs a display serif
           against the geometric sans, and the overlay headings are the
           only place in this app with a title to set that way. */
        --font-display: "Instrument Serif", Georgia, serif;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        /* The app itself never scrolls — only containers that opt in
           (the overlay panels' own overflow-y:auto) should. Without this,
           WebKit's backdrop-filter (on the overlay backdrops) can bleed
           its blur past the element's box and get counted as page
           overflow, putting a scrollbar on the whole window behind the
           modal instead of just inside it. */
        overflow: hidden;
        background: var(--bg);
        font-family: var(--font-ui);
        -webkit-font-smoothing: antialiased;
      }
      body {
        display: flex;
        flex-direction: column;
      }

      /* Tab bar — flat, no dividers; the active tab reads by a slightly
         lighter label and a thin accent underline, nothing else. */
      #tabbar {
        display: flex;
        flex: 0 0 auto;
        align-items: flex-end;
        gap: 2px;
        padding: 10px 10px 0;
        background: var(--bg);
        -webkit-app-region: drag;
        min-height: 44px;
        box-sizing: border-box;
      }
      .tab {
        -webkit-app-region: no-drag;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        font-size: 13px;
        font-weight: 500;
        color: var(--text-dim);
        border-radius: 6px 6px 0 0;
        cursor: pointer;
        user-select: none;
        transition: color 0.12s ease, background 0.12s ease;
      }
      .tab:hover {
        color: var(--text);
        background: var(--bg-hover);
      }
      .tab.active {
        color: var(--text);
        background: var(--bg-raised);
        box-shadow: inset 0 -2px 0 var(--accent);
      }
      .tab-close {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 18px;
        height: 18px;
        border-radius: 4px;
        font-size: 14px;
        line-height: 1;
        color: var(--text-faint);
      }
      .tab-close:hover {
        color: #f08a72;
        background: rgba(224, 112, 92, 0.16);
      }

      /* Panes */
      #panes {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        background: var(--bg-raised);
      }
      .pane {
        position: absolute;
        inset: 0;
        padding: 16px 18px;
        box-sizing: border-box;
      }

      /* Shared overlay chrome (Ctrl+M jobs/sessions, Preferences) — a
         softly blurred backdrop and a floating card, no hard borders. */
      #overlay,
      #prefs-overlay {
        position: absolute;
        inset: 0;
        background: rgba(18, 16, 15, 0.62);
        backdrop-filter: blur(6px);
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding-top: 64px;
        z-index: 10;
      }
      #overlay.hidden,
      #prefs-overlay.hidden {
        display: none;
      }
      .overlay-panel {
        background: var(--bg-raised);
        border-radius: 14px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        width: 480px;
        max-width: 90%;
        max-height: 70vh;
        overflow-y: auto;
        padding: 8px 0 14px;
      }
      .overlay-section + .overlay-section {
        border-top: 1px solid var(--border);
        margin-top: 6px;
        padding-top: 6px;
      }
      .overlay-heading {
        font-family: var(--font-display);
        color: var(--text);
        font-size: 18px;
        font-weight: 400;
        letter-spacing: 0.01em;
        padding: 14px 18px 8px;
      }
      .overlay-row {
        padding: 7px 18px;
        font-size: 13px;
        color: var(--text-dim);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        border-radius: 8px;
        margin: 0 6px;
      }
      .overlay-session {
        cursor: pointer;
      }
      .overlay-session:hover {
        background: var(--bg-hover);
        color: var(--text);
      }
      .overlay-empty {
        padding: 7px 18px;
        font-size: 13px;
        color: var(--text-faint);
      }
      .job-id {
        color: var(--text-faint);
        font-weight: 500;
      }
      .job-status {
        color: var(--accent);
        margin: 0 8px;
      }
      .job-mem {
        color: var(--text-dim);
        margin-right: 8px;
      }
      .job-cmd {
        color: var(--text-dim);
      }

      /* Preferences overlay */
      .prefs-panel {
        width: 640px;
        padding-top: 4px;
      }
      .prefs-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 18px;
        margin: 0 6px;
        border-radius: 8px;
      }
      .prefs-row:hover {
        background: var(--bg-hover);
      }
      .prefs-row-text {
        flex: 1 1 auto;
        min-width: 0;
      }
      .prefs-row-label {
        font-size: 13px;
        font-weight: 500;
        color: var(--text);
      }
      .prefs-row-desc {
        font-size: 11.5px;
        color: var(--text-faint);
        margin-top: 2px;
      }
      /* Key combos are the one place a mono face earns its keep in the
         chrome — "⌥⌫" and "⌃⇧F" line up column-wise down the list. */
      .prefs-row-combo {
        flex: 0 0 auto;
        min-width: 90px;
        text-align: right;
        font-family: "JetBrains Mono", Menlo, monospace;
        font-size: 12px;
        font-weight: 500;
        color: var(--accent);
        white-space: nowrap;
      }
      .prefs-row-recording .prefs-row-combo {
        font-family: var(--font-ui);
        color: #d9a94d;
        font-style: italic;
        font-weight: 400;
      }
      .prefs-btn {
        flex: 0 0 auto;
        font-family: inherit;
        font-size: 11.5px;
        font-weight: 500;
        color: var(--text-dim);
        background: transparent;
        border: none;
        border-radius: 6px;
        padding: 5px 10px;
        cursor: pointer;
        transition: color 0.12s ease, background 0.12s ease;
      }
      .prefs-btn:hover {
        color: var(--text);
        background: var(--bg-hover);
      }
      .prefs-footer {
        border-top: 1px solid var(--border);
        margin: 10px 6px 0;
        padding: 12px 12px 0;
        display: flex;
        justify-content: flex-end;
      }
    </style>
  </head>
  <body>
    <div id="tabbar"></div>
    <div id="panes"></div>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10/lib/addon-fit.js"></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
